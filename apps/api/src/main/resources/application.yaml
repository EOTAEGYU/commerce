spring:
  application:
    name: commerce
  datasource:
    url: jdbc:postgresql://localhost:5432/commerce
    username: commerce
    password: commerce1234
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:commerce-secret-key-must-be-at-least-32-characters-long}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
